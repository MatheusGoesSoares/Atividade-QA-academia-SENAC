<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Academia Fitness - Sistema de Gestão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }
    header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 25px; text-align: center; }
    header h1 { font-size: 2em; }
    header p { opacity: .8; margin-top: 6px; }
    .container { max-width: 960px; margin: 30px auto; padding: 0 20px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 18px; background: #ddd; border: none; cursor: pointer; border-radius: 6px; font-size: .9em; }
    .tab-btn.active { background: #1a1a2e; color: #fff; }
    .tab-content { display: none; background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    .tab-content.active { display: block; }
    h2 { color: #1a1a2e; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid #e8e8e8; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #555; font-size: .9em; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; }
    button.btn { background: #16213e; color: #fff; border: none; padding: 11px 28px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 8px; }
    button.btn:hover { background: #0f3460; }
    .resultado { margin-top: 16px; padding: 14px; border-radius: 6px; display: none; font-weight: bold; }
    .resultado.sucesso { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .resultado.erro    { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: .9em; }
    th { background: #1a1a2e; color: #fff; padding: 10px; text-align: left; }
    td { padding: 9px 10px; border-bottom: 1px solid #eee; }
    tr:nth-child(even) { background: #f9f9f9; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: .8em; font-weight: bold; }
    .badge.ativo   { background: #d4edda; color: #155724; }
    .badge.inativo { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <header>
    <h1>Academia Fitness</h1>
    <p>Sistema de Gestão de Membros</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('cadastro', this)">Cadastrar Membro</button>
      <button class="tab-btn" onclick="showTab('checkin', this)">Check-in</button>
      <button class="tab-btn" onclick="showTab('cancelar', this)">Cancelar Matrícula</button>
      <button class="tab-btn" onclick="showTab('renovar', this)">Renovar Plano</button>
      <button class="tab-btn" onclick="showTab('membros', this)">Ver Membros</button>
    </div>

    <!-- Cadastro -->
    <div id="tab-cadastro" class="tab-content active">
      <h2>Cadastrar Novo Membro</h2>
      <div class="form-group"><label>Nome Completo</label><input id="cad-nome" placeholder="Nome do membro"></div>
      <div class="form-group"><label>CPF</label><input id="cad-cpf" placeholder="000.000.000-00"></div>
      <div class="form-group"><label>Idade</label><input id="cad-idade" type="number" placeholder="Idade"></div>
      <div class="form-group">
        <label>Plano</label>
        <select id="cad-plano">
          <option value="mensal">Mensal — R$ 99,90</option>
          <option value="trimestral">Trimestral — R$ 269,90</option>
          <option value="anual">Anual — R$ 899,90</option>
        </select>
      </div>
      <button class="btn" onclick="cadastrar()">Cadastrar</button>
      <div id="res-cadastro" class="resultado"></div>
    </div>

    <!-- Check-in -->
    <div id="tab-checkin" class="tab-content">
      <h2>Realizar Check-in</h2>
      <div class="form-group"><label>CPF do Membro</label><input id="ci-cpf" placeholder="000.000.000-00"></div>
      <button class="btn" onclick="checkin()">Realizar Check-in</button>
      <div id="res-checkin" class="resultado"></div>
    </div>

    <!-- Cancelar -->
    <div id="tab-cancelar" class="tab-content">
      <h2>Cancelar Matrícula</h2>
      <div class="form-group"><label>CPF do Membro</label><input id="can-cpf" placeholder="000.000.000-00"></div>
      <button class="btn" onclick="cancelar()">Cancelar Matrícula</button>
      <div id="res-cancelar" class="resultado"></div>
    </div>

    <!-- Renovar -->
    <div id="tab-renovar" class="tab-content">
      <h2>Renovar Plano</h2>
      <div class="form-group"><label>CPF do Membro</label><input id="ren-cpf" placeholder="000.000.000-00"></div>
      <div class="form-group">
        <label>Novo Plano</label>
        <select id="ren-plano">
          <option value="mensal">Mensal — R$ 99,90</option>
          <option value="trimestral">Trimestral — R$ 269,90</option>
          <option value="anual">Anual — R$ 899,90</option>
        </select>
      </div>
      <button class="btn" onclick="renovar()">Renovar Plano</button>
      <div id="res-renovar" class="resultado"></div>
    </div>

    <!-- Membros -->
    <div id="tab-membros" class="tab-content">
      <h2>Lista de Membros Cadastrados</h2>
      <button class="btn" onclick="carregarMembros()">Atualizar Lista</button>
      <div id="res-membros"></div>
    </div>
  </div>

  <script>
    function showTab(name, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      btn.classList.add('active');
    }

    function mostrar(id, sucesso, msg) {
      const el = document.getElementById(id);
      el.style.display = 'block';
      el.className = 'resultado ' + (sucesso ? 'sucesso' : 'erro');
      el.textContent = msg;
    }

    async function post(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return r.json();
    }

    async function cadastrar() {
      const d = await post('/cadastrar', {
        nome: document.getElementById('cad-nome').value,
        cpf:  document.getElementById('cad-cpf').value,
        idade: document.getElementById('cad-idade').value,
        plano: document.getElementById('cad-plano').value,
      });
      mostrar('res-cadastro', d.sucesso, d.mensagem);
    }

    async function checkin() {
      const d = await post('/checkin', { cpf: document.getElementById('ci-cpf').value });
      mostrar('res-checkin', d.sucesso, d.mensagem);
    }

    async function cancelar() {
      const d = await post('/cancelar', { cpf: document.getElementById('can-cpf').value });
      mostrar('res-cancelar', d.sucesso, d.mensagem);
    }

    async function renovar() {
      const d = await post('/renovar', {
        cpf:  document.getElementById('ren-cpf').value,
        plano: document.getElementById('ren-plano').value,
      });
      mostrar('res-renovar', d.sucesso, d.mensagem);
    }

    async function carregarMembros() {
      const r = await fetch('/membros');
      const d = await r.json();
      const c = document.getElementById('res-membros');
      if (!d.membros.length) { c.innerHTML = '<p style="margin-top:16px;color:#666">Nenhum membro cadastrado.</p>'; return; }
      let html = '<table><tr><th>Nome</th><th>CPF</th><th>Plano</th><th>Vencimento</th><th>Status</th></tr>';
      d.membros.forEach(m => {
        html += `<tr><td>${m.nome}</td><td>${m.cpf}</td><td>${m.plano}</td><td>${m.data_vencimento}</td>
                 <td><span class="badge ${m.ativo ? 'ativo' : 'inativo'}">${m.ativo ? 'ATIVO' : 'INATIVO'}</span></td></tr>`;
      });
      c.innerHTML = html + '</table>';
    }
  </script>
</body>
</html>
